<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Advanced Mobile HTML IDE</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script><style>body,html{margin:0;padding:0;height:100%;display:flex;flex-direction:column;font-family:system-ui;background:#f4f4f4;}#editorContainer{padding:10px;background:#fff;border-bottom:1px solid #ccc;}.CodeMirror{height:45vh;min-height:120px;max-height:85vh;font-size:14px;border:1px solid #ccc;border-radius:6px;}.button-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}button{flex:1 1 auto;padding:10px;font-size:15px;cursor:pointer;border-radius:6px;border:1px solid #888;background:#fafafa;}button:hover{background:#eee;}select{width:100%;padding:8px;margin-top:8px;font-size:15px;}#output{flex-grow:1;border:none;width:100%;}@media(max-width:500px){.CodeMirror{height:50vh;font-size:13px;}button{font-size:13px;padding:8px;}}</style></head><body><div id="editorContainer"><button id="toggleBtn" onclick="toggleEditor()">🔽 Hide Editor</button><textarea id="codeInput"></textarea><div class="button-row"><button onclick="pasteCode()">📋 Paste</button><button onclick="runCode()">▶️ Run</button><button onclick="clearCode()">🗑️ Clear</button><button onclick="copyCode()">📋 Copy</button></div><div class="button-row"><button onclick="saveProject()">💾 Save</button><button onclick="saveAsProject()">💾 Save As</button><button onclick="renameProject()">✏️ Rename</button></div><label>Buka Proyek</label><select id="projectSelect" onchange="loadSelectedProject()"><option value="">-- Pilih proyek --</option></select><button style="width:100%;margin-top:5px;" onclick="deleteProject()">❌ Hapus Proyek</button><div class="button-row"><button onclick="exportProjects()">💾 Backup JSON</button><button onclick="backupAllProjects()">☁ Backup GAS</button><input type="file" id="importFile" style="flex:2" onchange="importProjects(this.files[0])"></div></div><iframe id="output"></iframe><script>/* =========================GAS API========================= */const GAS_API="https://script.google.com/macros/s/AKfycbz7JOcJKfgIaALxHnyuEc6WDTs1tGRzJwChe6u0dngG-_8ZIXqovLQK7M8MjWfleqWdLg/exec";async function backupProjectToGAS(name,project){try{const payload={app:"htmlEditor",name:name,code:project.code,lastModified:project.lastModified};const res=await fetch(GAS_API,{method:"POST",body:JSON.stringify(payload)});const data=await res.json();console.log("Backup GAS",data);}catch(err){console.error("Backup gagal",err);}}/* =========================CODEMIRROR========================= */let editor = CodeMirror.fromTextArea(document.getElementById("codeInput"),{mode:"htmlmixed",theme:"material-darker",lineNumbers:true,lineWrapping:true});editor.setValue(`<!DOCTYPE html><html><head><title>Demo</title></head><body><h1>Hello World</h1></body></html>`);editor.on("change",()=>{runCode();});/* =========================RUN========================= */function runCode(){document.getElementById("output").srcdoc = editor.getValue();}/* =========================EDITOR UTIL========================= */function clearCode(){editor.setValue("");document.getElementById("output").srcdoc="";}async function pasteCode(){try{const text = await navigator.clipboard.readText();editor.setValue(text);}catch(e){alert("Clipboard gagal");}}async function copyCode(){try{await navigator.clipboard.writeText(editor.getValue());alert("Kode tersalin");}catch(e){alert("Gagal copy");}}/* =========================TOGGLE========================= */let editorHidden=false;function toggleEditor(){const container=document.getElementById("editorContainer");const btn=document.getElementById("toggleBtn");Array.from(container.children).forEach((el,index)=>{if(index!==0){el.style.display=editorHidden?"":"none";}});editorHidden=!editorHidden;btn.textContent=editorHidden?"🔼 Show Editor":"🔽 Hide Editor";}/* =========================LOCAL STORAGE========================= */function getAllProjects(){const p=localStorage.getItem("htmlEditorProjects");return p?JSON.parse(p):{};}function saveAllProjects(p){localStorage.setItem("htmlEditorProjects",JSON.stringify(p));}/* =========================SAVE========================= */function saveProject(){const code=editor.getValue();if(!code.trim()){alert("Kode kosong");return;}const projects=getAllProjects();let name="project"+(Object.keys(projects).length+1);const projectData={code:code,lastModified:Date.now()};projects[name]=projectData;saveAllProjects(projects);backupProjectToGAS(name,projectData);updateProjectList();alert("Tersimpan "+name);}function saveAsProject(){const code=editor.getValue();const name=prompt("Nama proyek");if(!name)return;const projects=getAllProjects();const projectData={code:code,lastModified:Date.now()};projects[name]=projectData;saveAllProjects(projects);backupProjectToGAS(name,projectData);updateProjectList();}/* =========================BACKUP ALL========================= */async function backupAllProjects(){const projects=getAllProjects();const keys=Object.keys(projects);if(keys.length===0){alert("Tidak ada project");return;}for(const name of keys){await backupProjectToGAS(name,projects[name]);}alert("Semua project berhasil di backup ke GAS");}/* =========================RENAME========================= */function renameProject(){const select=document.getElementById("projectSelect");const oldName=select.value;if(!oldName){alert("Pilih proyek");return;}const newName=prompt("Nama baru",oldName);if(!newName)return;const projects=getAllProjects();projects[newName]=projects[oldName];delete projects[oldName];saveAllProjects(projects);updateProjectList();}/* =========================LOAD========================= */function loadSelectedProject(){const name=document.getElementById("projectSelect").value;if(!name)return;const projects=getAllProjects();editor.setValue(projects[name].code);runCode();}/* =========================DELETE========================= */function deleteProject(){const select=document.getElementById("projectSelect");const name=select.value;if(!name){alert("Pilih proyek");return;}if(confirm("Hapus "+name+" ?")){const projects=getAllProjects();delete projects[name];saveAllProjects(projects);updateProjectList();}}/* =========================PROJECT LIST========================= */function updateProjectList(){const select=document.getElementById("projectSelect");select.innerHTML='<option value="">-- Pilih proyek --</option>';const projects=getAllProjects();Object.keys(projects).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k;select.appendChild(o);});}/* =========================EXPORT========================= */function exportProjects(){const data=localStorage.getItem("htmlEditorProjects");if(!data){alert("Belum ada proyek");return;}const blob=new Blob([data],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="htmlEditorProjects.json";a.click();}/* =========================IMPORT========================= */function importProjects(file){const reader=new FileReader();reader.onload=function(e){const imported=JSON.parse(e.target.result);const current=getAllProjects();const merged={...current,...imported};saveAllProjects(merged);updateProjectList();};reader.readAsText(file);}/* init */updateProjectList();runCode();</script></body></html>
