<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAS Terminal - Deploy Editor</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 20px; background: #f4f4f4; }
  textarea { width: 100%; font-family: monospace; margin-bottom: 10px; }
  input, button { padding: 8px; margin-bottom: 10px; width: 100%; }
  #result { background: #fff; padding: 10px; border: 1px solid #ccc; word-break: break-all; }
  label { font-weight: bold; display: block; margin-top: 10px; }
</style>
</head>
<body>

<h2>GAS Terminal - Deploy Project Baru</h2>

<form id="deployForm">
  <label>Nama Project</label>
  <input type="text" name="namaProject" placeholder="Nama Project" required value="MyProject">

  <label>File .gs</label>
  <textarea name="gsCode" rows="12">
// Contoh kode GS yang akan di-deploy
function helloTerminal() {
  return "Halo dari GAS Terminal!";
}
  </textarea>

  <label>File .html (opsional)</label>
  <textarea name="htmlCode" rows="8">
<!-- Contoh HTML Web App -->
<h1>Halo Web App</h1>
<p>Ini contoh HTML yang akan di-deploy bersama GAS.</p>
  </textarea>

  <button type="submit">Deploy Project</button>
</form>

<h3>Hasil Deploy</h3>
<input type="text" id="result" readonly placeholder="Link Web App akan muncul di sini">

<script>
document.getElementById("deployForm").addEventListener("submit", async (e)=>{
  e.preventDefault();

  const namaProject = e.target.namaProject.value;
  const gsCode = e.target.gsCode.value;
  const htmlCode = e.target.htmlCode.value;

  // Build files array
  const files = [
    { name: "Code", type: "SERVER_JS", source: gsCode }
  ];

  if (htmlCode.trim()) {
    files.push({ name: "Index", type: "HTML", source: htmlCode });
  }

  try {
    const resp = await fetch("https://script.google.com/macros/s/AKfycbxv8kw4jdaReKz5LmfEGvpGPBoKTf1buNCUUyrh-x6JkxyAjLQOGuIjCbxaSgS1YoGaSw/exec", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ namaProject, files })
    });

    const data = await resp.json();

    if (data.status === "ok") {
      const resultInput = document.getElementById("result");
      resultInput.value = data.url;
      resultInput.select(); // bisa langsung copy Ctrl+C
    } else {
      alert("Error: " + data.message);
    }
  } catch(err) {
    alert("Fetch error: " + err.message);
  }
});
</script>

</body>
</html>
