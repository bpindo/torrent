<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Auto-Adapt Kolom</title>
<style>
  body {margin:0;font-family:system-ui,sans-serif;background:#f4f4f4;padding:10px;}
  .container{max-width:600px;margin:auto;background:#fff;padding:15px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
  input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;border-radius:6px;border:1px solid #ccc;box-sizing:border-box;}
  button{background-color:#4CAF50;color:white;border:none;cursor:pointer;}
  button:hover{background-color:#45a049;}
  .btn-group{display:flex;gap:10px;margin:6px 0;}
  .btn-group button{flex:1;}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  table, th, td{border:1px solid #ccc;}
  th, td{padding:10px;text-align:left;font-size:14px;word-break:break-word;}
  @media(max-width:400px){th,td{font-size:12px;padding:8px;} input,button{font-size:14px;padding:10px;}}
</style>
</head>
<body>
<div class="container">
  <h3>Demo Input JSON – Auto-Adapt Kolom</h3>
  <input id="kode" placeholder='Masukkan kode atau JSON, contoh: {"kode":"ABC"}'>
  <div class="btn-group">
    <button id="kirimBtn">Kirim Data</button>
    <button id="ambilBtn">Ambil & Salin Data Terakhir</button>
  </div>

  <table>
    <thead id="tableHead"><tr></tr></thead>
    <tbody id="hasil"></tbody>
  </table>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbw2VnEteOJL__Mdp1sIu4ZwwBncc-Dd0v7gdpGgqPJAV5VYMkqdyCq5UX94ot05oCWIbA/exec";

// ===== Kirim data ke GAS =====
async function kirim() {
  const kodeInput = document.getElementById("kode");
  let payload = {};
  try {
    if(kodeInput.value.trim()){
      try { payload = JSON.parse(kodeInput.value.trim()); }
      catch { payload = {kode: kodeInput.value.trim()}; }
    }
    const res = await fetch(API, {method:"POST", body:JSON.stringify(payload)});
    const data = await res.json();
    if(data.status==="ok"){
      kodeInput.value="";
      alert("Data berhasil dikirim!");
      ambil();
    } else alert("Gagal kirim: "+data.message);
  } catch(err){console.error(err); alert("Gagal kirim data!");}
}

// ===== Ambil semua data dan auto-adapt kolom =====
async function ambil() {
  try {
    const res = await fetch(API+"?t="+Date.now());
    const d = await res.json();
    const tbody = document.getElementById("hasil");
    const theadRow = document.getElementById("tableHead").querySelector("tr");

    tbody.innerHTML = "";

    if(!d || d.length===0){
      theadRow.innerHTML="<th>Belum ada data</th>";
      return;
    }

    // Cari semua key unik dari seluruh data (auto-adapt kolom)
    const allKeys = new Set();
    d.forEach(item => Object.keys(item).forEach(k => allKeys.add(k)));
    const headers = Array.from(allKeys);

    // Update header
    theadRow.innerHTML="";
    headers.forEach(h=>{
      const th = document.createElement("th");
      th.innerText = h;
      theadRow.appendChild(th);
    });

    // Buat row
    d.forEach(item=>{
      const tr = document.createElement("tr");
      headers.forEach(h=>{
        const td = document.createElement("td");
        if(h==="waktu") td.innerText = new Date(item[h]*1000).toLocaleString();
        else td.innerText = item[h] || "";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    return d[d.length-1];
  } catch(err){console.error(err); return null;}
}

// ===== Tombol =====
document.getElementById("kirimBtn").addEventListener("click", kirim);
document.getElementById("ambilBtn").addEventListener("click", async ()=>{
  const lastData = await ambil();
  if(!lastData){alert("Belum ada data"); return;}
  await navigator.clipboard.writeText(JSON.stringify(lastData));
  alert("Data terakhir disalin: "+JSON.stringify(lastData));
});

// ===== Auto refresh =====
ambil();
setInterval(ambil,3000);

// ===== Contoh input JSON demo =====
const contohInputs = [
  '{"kode":"ABC123"}',
  '{"kode":"DEF456","peerId":"XYZ789"}',
  '{"kode":"GHI789","peerId":"LMN456","status":"aktif"}',
  '{"kode":"JKL321","peerId":"OPQ123","status":"nonaktif","lokasi":"Jakarta"}',
  '{"kode":"MNO654","peerId":"RST789","status":"aktif","lokasi":"Bandung","catatan":"urgent"}'
];

// Auto kirim contoh demo satu per satu tiap 1 detik
let indexDemo=0;
const intervalDemo = setInterval(()=>{
  if(indexDemo>=contohInputs.length){ clearInterval(intervalDemo); return; }
  document.getElementById("kode").value=contohInputs[indexDemo];
  kirim();
  indexDemo++;
}, 1000);
</script>
</body>
</html>
