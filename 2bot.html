<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAB Dummy User GAS Live</title>
<style>
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#f4f4f4;
  padding:10px;
}
.container{
  max-width:500px;
  margin:auto;
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}
input,button{
  width:100%;
  padding:12px;
  margin:6px 0;
  font-size:16px;
  border-radius:6px;
  border:1px solid #ccc;
  box-sizing:border-box;
}
button{
  background-color:#2563eb;
  color:white;
  border:none;
  cursor:pointer;
}
button:hover{background-color:#1e4fd8;}
.btn-group{display:flex; gap:10px; margin:6px 0;}
.btn-group button{flex:1;}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}
table,th,td{border:1px solid #ccc;}
th,td{padding:10px;text-align:left;font-size:14px;word-break:break-word;}
@media (max-width:400px){
  th,td{font-size:12px;padding:8px;}
  input,button{font-size:14px;padding:10px;}
}
</style>
</head>
<body>
<div class="container">
<h2>LAB Dummy User GAS</h2>

<div class="btn-group">
  <button id="tambahBtn">Tambah User Dummy</button>
  <button id="copyBtn">Copy User ID Terakhir</button>
</div>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Created At</th>
      <th>Last Active</th>
    </tr>
  </thead>
  <tbody id="userTable"></tbody>
</table>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbzBQPfAzh1GZjz7gPH5CTxupUs6rlSdEV1Sw-EVYFpuBM4Q9W5hicLkfNNXB152MjBQ3g/exec";

// ===== Fungsi POST async =====
async function apiPost(payload){
  try{
    const res = await fetch(API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    return await res.json();
  }catch(err){
    console.error(err);
    alert("Gagal hubungi API!");
    return null;
  }
}

// ===== Tambah User Dummy =====
async function tambahUserDummy(){
  const userId = Date.now();
  const username = "User"+Math.floor(Math.random()*10000);
  const res = await apiPost({action:"createUser", userId, username});
  if(res && res.status==="ok"){
    alert(`User Dummy Ditambahkan:\n${username} (ID: ${userId})`);
    await listUsers(); // refresh tabel otomatis
  }
}

// ===== Lihat semua user =====
async function listUsers(){
  const res = await apiPost({action:"listUsers"});
  const table = document.getElementById("userTable");
  table.innerHTML="";
  if(!res || !res.data || res.data.length===0){
    table.innerHTML="<tr><td colspan='4'>Belum ada user.</td></tr>";
    return;
  }
  res.data.forEach(u=>{
    table.innerHTML += `<tr>
      <td>${u.id}</td>
      <td>${u.username}</td>
      <td>${new Date(u.createdAt).toLocaleString()}</td>
      <td>${new Date(u.lastActive).toLocaleString()}</td>
    </tr>`;
  });
}

// ===== Copy User ID terakhir =====
async function copyLastUserId(){
  const table = document.getElementById("userTable");
  const rows = table.getElementsByTagName("tr");
  if(rows.length===0 || rows[0].cells.length<1){
    alert("Belum ada user.");
    return;
  }
  const lastRow = rows[rows.length-1];
  const userId = lastRow.cells[0].innerText;
  await navigator.clipboard.writeText(userId);
  alert("User ID terakhir disalin: " + userId);
}

// ===== Event Listener =====
document.getElementById("tambahBtn").addEventListener("click", tambahUserDummy);
document.getElementById("copyBtn").addEventListener("click", copyLastUserId);

// ===== Auto refresh tabel setiap 3 detik =====
listUsers();
setInterval(listUsers,3000);
</script>
</body>
</html>
