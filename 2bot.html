<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Mobile Ready - Kirim Kode</title>
<style>
  body {margin:0;font-family:system-ui,sans-serif;background:#f4f4f4;padding:10px;}
  .container{max-width:500px;margin:auto;background:#fff;padding:15px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,0.1);}
  input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;border-radius:6px;border:1px solid #ccc;box-sizing:border-box;}
  button{background-color:#4CAF50;color:white;border:none;cursor:pointer;}
  button:hover{background-color:#45a049;}
  .btn-group{display:flex;gap:10px;margin:6px 0;}
  .btn-group button{flex:1;}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  table, th, td{border:1px solid #ccc;}
  th, td{padding:10px;text-align:left;font-size:14px;word-break:break-word;}
  @media(max-width:400px){th,td{font-size:12px;padding:8px;} input,button{font-size:14px;padding:10px;}}
</style>
</head>
<body>
<div class="container">
  <input id="kode" placeholder="Masukkan kode atau data JSON (opsional)">
  <div class="btn-group">
    <button id="kirimBtn">Kirim</button>
  </div>
  <button id="ambilBtn">Ambil Data Terakhir</button>

  <table>
    <thead id="tableHead">
      <tr><th>Waktu</th><th>Kode</th></tr> <!-- Minimal satu kolom default -->
    </thead>
    <tbody id="hasil"></tbody>
  </table>
</div>

<script>
const API="YOUR_GAS_URL_HERE"; // ganti dengan URL GAS mu

// ===== Fungsi Kirim =====
async function kirim() {
  const kodeInput = document.getElementById("kode");
  let payload = {};
  try {
    if(kodeInput.value.trim()){
      try{
        payload = JSON.parse(kodeInput.value.trim());
      } catch{
        payload = {kode: kodeInput.value.trim()};
      }
    }
    const res = await fetch(API, {method:"POST", body:JSON.stringify(payload)});
    const data = await res.json();
    if(data.status==="ok"){
      kodeInput.value="";
      alert("Data berhasil dikirim!");
      ambil(); // refresh tabel
    } else alert("Gagal kirim: "+data.message);
  } catch(err){console.error(err); alert("Gagal kirim data!");}
}

// ===== Fungsi Ambil =====
async function ambil() {
  try {
    const res = await fetch(API+"?t="+Date.now());
    const d = await res.json();
    const tbody = document.getElementById("hasil");
    const theadRow = document.getElementById("tableHead").querySelector("tr");

    tbody.innerHTML = "";

    if(!d || d.length===0){
      if(theadRow.children.length===0){
        const th = document.createElement("th");
        th.innerText="Data Kosong";
        theadRow.appendChild(th);
      }
      return;
    }

    // update header otomatis
    const headers = Object.keys(d[0]);
    theadRow.innerHTML = "";
    headers.forEach(h=>{
      const th = document.createElement("th");
      th.innerText = h;
      theadRow.appendChild(th);
    });

    // buat row
    d.forEach(item=>{
      const tr = document.createElement("tr");
      headers.forEach(h=>{
        const td = document.createElement("td");
        td.innerText = item[h] || "";
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    return d[d.length-1];
  } catch(err){console.error(err); return null;}
}

// ===== Tombol =====
document.getElementById("kirimBtn").addEventListener("click", kirim);
document.getElementById("ambilBtn").addEventListener("click", async ()=>{
  const lastData = await ambil();
  if(!lastData){alert("Belum ada data"); return;}
  await navigator.clipboard.writeText(JSON.stringify(lastData));
  alert("Data terakhir disalin: "+JSON.stringify(lastData));
});

// ===== Auto refresh =====
ambil();
setInterval(ambil,3000);
</script>
</body>
</html>
