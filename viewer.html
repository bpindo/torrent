<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full-Featured Live HTML/JS Editor</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    font-family: system-ui, sans-serif;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #f9f9f9;
  }
  #editorContainer {
    padding: 10px;
    background: #fff;
    border-bottom: 1px solid #ccc;
  }
  textarea {
    width: 100%;
    min-height: 150px;
    font-family: monospace;
    font-size: 14px;
    padding: 10px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
    resize: vertical;
  }
  button {
    margin-top: 10px;
    margin-right: 5px;
    padding: 6px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  select {
    margin-top: 10px;
    padding: 5px 8px;
    font-size: 14px;
  }
  #output {
    flex-grow: 1;
    width: 100%;
    border: none;
  }
</style>
</head>
<body>

<div id="editorContainer">
  <button onclick="toggleEditor()">🔽 Toggle Input</button>
  <br>
  <textarea id="codeInput" placeholder="Tulis kode HTML/JS di sini..."></textarea>
  <br>
  <button onclick="pasteCode()">📋 Paste</button>
  <button onclick="runCode()">▶️ Run</button>
  <button onclick="clearCode()">🗑️ Clear</button>
  <button onclick="copyCode()">📋 Copy Kode</button>
  <button onclick="saveProject()">💾 Save</button>
  <button onclick="saveAsProject()">💾 Save As</button>
  <button onclick="renameProject()">✏️ Rename Project</button>

  <br><br>
  <label for="projectSelect">Buka Proyek:</label>
  <select id="projectSelect" onchange="loadSelectedProject()">
    <option value="">-- Pilih proyek --</option>
  </select>
  <button onclick="deleteProject()">❌ Hapus Proyek</button>
</div>

<iframe id="output"></iframe>

<script>
let defaultProjectCounter = 1;

// Jalankan kode di iframe
function runCode() {
  const code = document.getElementById('codeInput').value;
  document.getElementById('output').srcdoc = code;
}

// Hapus isi textarea dan iframe
function clearCode() {
  document.getElementById('codeInput').value = '';
  document.getElementById('output').srcdoc = '';
}

// Paste dari clipboard ke textarea
async function pasteCode() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('codeInput').value = text;
  } catch (err) {
    alert('Gagal membaca clipboard: ' + err);
  }
}

// Copy kode input ke clipboard
async function copyCode() {
  const code = document.getElementById('codeInput').value;
  if (!code.trim()) { alert('Tidak ada kode untuk disalin!'); return; }
  try {
    await navigator.clipboard.writeText(code);
    alert('Kode berhasil disalin ke clipboard!');
  } catch (err) {
    alert('Gagal menyalin kode: ' + err);
  }
}

// Toggle lipat/buka textarea dan semua tombol kecuali toggle
function toggleEditor() {
  const editorContainer = document.getElementById('editorContainer');
  const children = Array.from(editorContainer.children);
  children.forEach(el => {
    if (el.tagName !== 'BUTTON' || !el.textContent.includes('Toggle Input')) {
      el.style.display = (el.style.display === 'none') ? 'block' : 'none';
    }
  });
}

// Save default project
function saveProject() {
  const code = document.getElementById('codeInput').value;
  if (!code.trim()) { alert('Kode kosong!'); return; }
  const name = 'project' + defaultProjectCounter;
  localStorage.setItem(name, code);
  defaultProjectCounter++;
  alert(`Proyek tersimpan sebagai "${name}"`);
  updateProjectList();
}

// Save As project
function saveAsProject() {
  const code = document.getElementById('codeInput').value;
  if (!code.trim()) { alert('Kode kosong!'); return; }
  const name = prompt('Masukkan nama proyek:', 'project_custom');
  if (!name) return;
  localStorage.setItem(name, code);
  alert(`Proyek tersimpan sebagai "${name}"`);
  updateProjectList();
}

// Rename project
function renameProject() {
  const select = document.getElementById('projectSelect');
  const oldName = select.value;
  if (!oldName) { alert('Pilih proyek terlebih dahulu!'); return; }
  const newName = prompt('Masukkan nama baru untuk proyek:', oldName);
  if (!newName) return;
  if (localStorage.getItem(newName)) {
    alert('Nama proyek sudah ada! Gunakan nama lain.');
    return;
  }
  const code = localStorage.getItem(oldName);
  localStorage.setItem(newName, code);
  localStorage.removeItem(oldName);
  alert(`Proyek "${oldName}" diganti menjadi "${newName}"`);
  updateProjectList();
}

// Load project dari dropdown
function loadSelectedProject() {
  const select = document.getElementById('projectSelect');
  const name = select.value;
  if (!name) return;
  const code = localStorage.getItem(name);
  if (code !== null) {
    document.getElementById('codeInput').value = code;
    runCode();
  }
}

// Hapus proyek terpilih
function deleteProject() {
  const select = document.getElementById('projectSelect');
  const name = select.value;
  if (!name) { alert('Pilih proyek terlebih dahulu!'); return; }
  if (confirm(`Yakin ingin menghapus proyek "${name}"?`)) {
    localStorage.removeItem(name);
    alert(`Proyek "${name}" telah dihapus`);
    updateProjectList();
  }
}

// Update dropdown proyek
function updateProjectList() {
  const select = document.getElementById('projectSelect');
  select.innerHTML = '<option value="">-- Pilih proyek --</option>';
  Object.keys(localStorage).forEach(key => {
    const option = document.createElement('option');
    option.value = key;
    option.textContent = key;
    select.appendChild(option);
  });
}

// Inisialisasi
updateProjectList();
</script>

</body>
</html>
