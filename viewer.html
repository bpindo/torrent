<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live HTML/JS Editor Lengkap</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    margin: 20px;
    background: #f9f9f9;
  }
  textarea {
    width: 100%;
    height: 200px;
    font-family: monospace;
    font-size: 14px;
    padding: 10px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
    resize: vertical;
  }
  iframe {
    width: 100%;
    height: 300px;
    border: 1px solid #ccc;
    margin-top: 15px;
    border-radius: 5px;
  }
  button {
    margin-top: 10px;
    margin-right: 5px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<h2>Live HTML/JS Editor Lengkap</h2>
<p>Masukkan kode HTML/JS Anda di bawah ini:</p>

<textarea id="codeInput" placeholder="Tulis kode HTML/JS di sini..."></textarea>
<br>
<button onclick="pasteCode()">📋 Paste</button>
<button onclick="runCode()">▶️ Run</button>
<button onclick="clearCode()">🗑️ Clear</button>

<h3>Hasil:</h3>
<iframe id="output"></iframe>

<script>
// Jalankan kode di iframe
function runCode() {
  const code = document.getElementById('codeInput').value;
  const iframe = document.getElementById('output');
  iframe.srcdoc = code;
}

// Hapus isi textarea dan iframe
function clearCode() {
  document.getElementById('codeInput').value = '';
  document.getElementById('output').srcdoc = '';
}

// Paste dari clipboard ke textarea
async function pasteCode() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('codeInput').value = text;
  } catch (err) {
    alert('Gagal membaca clipboard: ' + err);
  }
}
</script>

</body>
</html>
