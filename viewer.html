<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live HTML/JS Editor Maksimal</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    font-family: system-ui, sans-serif;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #f9f9f9;
  }
  #editorContainer {
    padding: 10px;
    background: #fff;
    border-bottom: 1px solid #ccc;
  }
  textarea {
    width: 100%;
    min-height: 150px;
    font-family: monospace;
    font-size: 14px;
    padding: 10px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 5px;
    resize: vertical;
  }
  button {
    margin-top: 10px;
    margin-right: 5px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  #output {
    flex-grow: 1;
    width: 100%;
    border: none;
  }
</style>
</head>
<body>

<div id="editorContainer">
  <button onclick="toggleEditor()">🔽 Toggle Input</button>
  <br>
  <textarea id="codeInput" placeholder="Tulis kode HTML/JS di sini..."></textarea>
  <br>
  <button onclick="pasteCode()">📋 Paste</button>
  <button onclick="runCode()">▶️ Run</button>
  <button onclick="clearCode()">🗑️ Clear</button>
</div>

<iframe id="output"></iframe>

<script>
// Jalankan kode di iframe
function runCode() {
  const code = document.getElementById('codeInput').value;
  document.getElementById('output').srcdoc = code;
}

// Hapus isi textarea dan iframe
function clearCode() {
  document.getElementById('codeInput').value = '';
  document.getElementById('output').srcdoc = '';
}

// Paste dari clipboard ke textarea
async function pasteCode() {
  try {
    const text = await navigator.clipboard.readText();
    document.getElementById('codeInput').value = text;
  } catch (err) {
    alert('Gagal membaca clipboard: ' + err);
  }
}

// Toggle lipat/buka textarea
function toggleEditor() {
  const editor = document.getElementById('codeInput');
  if (editor.style.display === 'none') {
    editor.style.display = 'block';
  } else {
    editor.style.display = 'none';
  }
}
</script>

</body>
</html>
